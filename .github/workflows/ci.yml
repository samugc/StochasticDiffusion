name: Build and historical analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libeigen3-dev \
            libceres-dev \
            libboost-dev

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test C++ demo
        run: ctest --test-dir build --output-on-failure

      - name: Install historical-analysis dependencies
        run: python -m pip install -r python/requirements-historical.txt

      - name: Regenerate historical analysis
        run: python -B python/analyze_historical_results.py

      - name: Validate historical results
        run: python -B -m unittest discover -s python -p 'test_historical_results.py' -v
